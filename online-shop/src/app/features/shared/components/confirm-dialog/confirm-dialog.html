<h2 mat-dialog-title class="dialog-title">
    Confirm
</h2>

<mat-dialog-content>
    <p class="dialog-message">
        {{ data.message }}
    </p>
</mat-dialog-content>

<mat-dialog-actions>
    <button mat-flat-button color="warn" [mat-dialog-close]="true">
        Yes, delete
    </button>
    <button mat-stroked-button [mat-dialog-close]="false">
        N0
    </button>
</mat-dialog-actions>
