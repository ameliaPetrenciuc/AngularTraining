@if (product()) {
  <div class="details-card">
    <h2>{{ product()?.name}}</h2>
    <p><strong>Price:</strong> {{ product()?.price | currency:'USD':'symbol':'1.2-2' }}</p>
    <p><strong>Description:</strong> {{ product()?.description }}</p>

    <button class="add-button" (click)="addToCart.emit()">
      Add to Cart
    </button>
  </div>
}
